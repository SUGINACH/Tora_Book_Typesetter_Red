name: layout-parity

# השוואה אבחונית לדוגמת PDF היסטורית מוקדמת — אינה מפרט עימוד או שער איכות.
#
# הגרסה הישנה (הצהובה) הפיקה את קובצי ה-PDF ב-audits (כולל גרסאות עם סימון
# גיאומטרי בלתי־נראה: תגיות p-end/p-cut + מידות בלוקים). extract-reference.py
# הופך אותם לייצוג מתמטי מחויב (audits/layout-reference.json) — והרצה הזו
# משווה את הפלט החי של RED לדוגמה ההיסטורית לצורכי אבחון בלבד (נתיב האפליקציה,
# מדידת font-metrics, ייצוא PDF) מול אותו ייחוס:
#
#   HARD   — אינווריאנטים עצמאיים: שימור תוכן, אפס חפיפות וגבולות עמוד; H4 הוא LEGACY.
#   LEGACY COMPARISON — מרחק מדוגמת העימוד הישנה; אינו קובע נכונות או איכות.
#            P1–P9, ובפרט P6/P7, נשמרים לחקירת הבדלים היסטוריים בלבד.
#
#
#
# ציון ההשוואה הוא מרחק היסטורי בלבד; אין להשתמש בו כ-ratchet, יעד או שער קבלה.
# רק כשל HARD באינווריאנט עצמאי חוסם. קודי יציאה: 0 תקין | 1 HARD | 2 legacy-difference | 3 שניהם.
#
# הערה: הייחוס נבדק לדטרמיניזם — ריצה מחדש של החילוץ חייבת לתת קובץ זהה
# בתת-ספרה (git diff) — אחרת ההשוואה אינה תקפה.

on:
  push:
    branches: [ main, UNIFIED ]
  pull_request:
    branches: [ main, UNIFIED ]
  workflow_dispatch:

jobs:
  layout-parity:
    runs-on: ubuntu-latest
    # **S5.2 (P-11):** תקרה מפורשת לכל job — בלי זה ריצה תקועה מחזיקה ראנר
    # עד חיתוך ברירת המחדל של GitHub (360 דק').
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyMuPDF (חילוץ גיאומטריה מ-PDF)
        run: pip install pymupdf==1.26.7

      - name: Verify the historical sample extraction is deterministic (committed JSON == PDFs)
        run: |
          python3 tools/layout-parity/extract-reference.py
          git diff --exit-code -- audits/layout-reference.json || {
            echo "✗ audits/layout-reference.json אינו תואם לחילוץ מקובצי ה-PDF — הרץ extract-reference.py והחלף ב-commit"; exit 1; }

      - name: Run RED through the live path (IMUD defaults + real font → model + PDF)
        run: node tools/layout-parity/run-ours.js

      - name: Diagnostic comparison against the historical sample (non-normative)
        run: |
          set +e
          python3 tools/layout-parity/compare.py \
            audits/layout-reference.json \
            audits/layout-parity-artifacts/ours-model.json \
            audits/layout-parity-artifacts/ours.pdf \
            audits/layout-parity-artifacts/parity-report.json
          ec=$?
          set -e
          # קודי יציאה של compare.py: 0 תקין | 1 כשל HARD | 2 כשל PARITY | 3 שניהם.
          # **04.11:** כשל HARD = באג אמיתי (חפיפות/גלישות/אובדן תוכן) — קטלני.
          # פערי PARITY = עבודת כיול פתוחה מתועדת (הציון ממשיך לעלות עם כל
          # תיקון; הדוח המלא עולה כ-artifact) — אינם חוסמים את ה-CI, אחרת
          # כל דחיפה עד השלמת הזהות המלאה הייתה אדומה ואות אזהרה היה נחלש.
          if [ "$ec" -eq 1 ] || [ "$ec" -eq 3 ]; then
            echo "✗ HARD invariants FAILED (exit $ec) — כשל נכונות אמיתי"; exit 1
          fi
          if [ "$ec" -eq 2 ]; then
            score=$(python3 -c "import json;print(json.load(open('audits/layout-parity-artifacts/parity-report.json'))['summary']['score'])")
            echo "ℹ Legacy sample distance: ${score}% (diagnostic only; not a correctness or quality score; full report in artifact)"
          fi

      # No parity-score ratchet: the old PDF is an illustrative historical sample,
      # not the final product specification. Only independent HARD invariants block CI.

      - name: Always upload the full report + our PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-parity-report
          path: |
            audits/layout-parity-artifacts/parity-report.json
            audits/layout-parity-artifacts/ours-model.json
            audits/layout-parity-artifacts/ours.pdf
          if-no-files-found: warn

  # **04.11 (בקשת המשתמש: "כל הבדיקות צריכות להיעשות על הקובץ ה'גדול מאוד'"):**
  # הקורפוס הגדול מאוד — audits/very_long_test_text.txt (3.4MB, 2,571 כותרות,
  # 10 חלקים, 363K מילים). לקורפוס זה אין ייחוס PDF של הגרסה הישנה, ולכן
  # הבדיקה היא באינווריאנטים מוחלטים בלבד (verify-corpus.py): תכונות שכל
  # עימוד נכון חייב לקיים בפני עצמו, בלי תלות באף פלט חיצוני —
  #   C1 שימור תוכן (מולטיסט מילים) · C2 אפס חפיפות · C3 גבולות עמוד ·
  #   C4 מדד איכות יישור (מידע בלבד כברירת מחדל; שער רק עם --justify-floor מאושר) · C5 רצף עמודונים · C6 מכונת מצבים · C7 שלמות תוכן-עניינים ·
  #   C8 כותרות עליונות · C9 שימור כותרות · C10 הערות שוליים · C11 PDF תקין ·
  #   C12 ייצוא HTML (S4.11 — אותו רינדור כמו התצוגה החיה).
  # בנוסף: דטרמיניזם (הרצה כפולה — hash ועמודים זהים) בתוך run-ours.js,
  # והספר המיוצא עצמו (PDF+HTML) עולה כ-artifact.
  # זה הקורפוס שחשף את שלושת באגי ההערות שתוקנו ב-S4.10 — קובעי הרף שלו
  # הם שומרי הרגרסיה לכל תיקון עתידי.
  very-long-corpus:
    runs-on: ubuntu-latest
    # **S5.2 (P-11):** תקרה מפורשת — כמו בכל שאר ה-jobs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyMuPDF (חילוץ גיאומטריה מ-PDF)
        run: pip install pymupdf==1.26.7

      - name: Run RED on the very large corpus (live path + determinism double-run + HTML export)
        run: node tools/layout-parity/run-ours.js audits/very_long_test_text.txt audits/very-long-artifacts --determinism --html

      - name: Corpus invariants + informational alignment metric (C1..C12 — כולל ייצוא HTML)
        run: |
          python3 tools/layout-parity/verify-corpus.py \
            audits/very_long_test_text.txt \
            audits/very-long-artifacts/ours-model.json \
            audits/very-long-artifacts/ours.pdf \
            audits/very-long-artifacts/corpus-report.json \
            audits/very-long-artifacts/ours.html

      - name: Always upload the corpus report + the exported book
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: very-long-corpus-report
          path: |
            audits/very-long-artifacts/corpus-report.json
            audits/very-long-artifacts/ours-model.json
            audits/very-long-artifacts/ours.html
            audits/very-long-artifacts/ours.pdf
          if-no-files-found: warn
